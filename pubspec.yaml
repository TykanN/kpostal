name: kpostal
description: Kpostal package can search for Korean postal addresses using Kakao postcode service.
version: 2.0.0
homepage: https://github.com/tykann/kpostal

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  geocoding: ^5.0.0
  geocoding_platform_interface: ^5.0.0
  web: ^1.1.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  webview_flutter_platform_interface: ^2.15.1

flutter:
  assets:
    - assets/kakao_postcode_localhost.html
